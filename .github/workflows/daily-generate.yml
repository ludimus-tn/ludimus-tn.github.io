name: Daily Site Generator

on:
  schedule:
    - cron: '0 23 * * *'   # 23:00 UTC daily (midnight/01:00 in Italy)
  workflow_dispatch:       # Allows manual trigger from GitHub UI

permissions:
  contents: write

concurrency:
  group: daily-site-generator
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run calendar refresh
        run: |
          mkdir -p "$RUNNER_TEMP/calendar-preview"
          python processors/calendar_events.py --future-months 6 --output-dir "$RUNNER_TEMP/calendar-preview" --brief --apply

      - name: Save calendar report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-failure-report
          path: ${{ runner.temp }}/calendar-preview/calendar-preview.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Run generator script
        run: python processors/generate.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily auto-regenerate site"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
